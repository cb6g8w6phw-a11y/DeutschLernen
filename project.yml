name: DeutschLernen
options:
  bundleIdPrefix: com.example
targets:
  DeutschLernen:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: DeutschLernen
        excludes:
          - Info.plist
      - path: Shared
    dependencies:
      - target: DeutschWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.DeutschLernen
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Deutsch
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Mikrofon służy do mówienia po niemiecku i sprawdzania wymowy."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Rozpoznawanie mowy zamienia to, co mówisz, na tekst po niemiecku."
        INFOPLIST_KEY_NSCameraUsageDescription: "Aparat skanuje niemieckie listy, instrukcje i tabliczki."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Zdjęcie z galerii można przetłumaczyć i dodać do powtórek."
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSSupportsLiveActivitiesFrequentUpdates: YES
        MARKETING_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: "48"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: DeutschLernen/Info.plist
  DeutschWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Widget
        excludes:
          - Info.plist
      - path: Shared
    info:
      path: Widget/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.DeutschLernen.widget
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: "48"
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
