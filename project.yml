name: DeutschLernen
options:
  bundleIdPrefix: com.example
targets:
  DeutschLernen:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources: [DeutschLernen]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.DeutschLernen
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Deutsch
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Mikrofon służy do mówienia po niemiecku i sprawdzania wymowy."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Rozpoznawanie mowy zamienia to, co mówisz, na tekst po niemiecku."
        INFOPLIST_KEY_NSCameraUsageDescription: "Aparat skanuje niemieckie listy, instrukcje i tabliczki."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Zdjęcie z galerii można przetłumaczyć i dodać do powtórek."
        MARKETING_VERSION: "2.6"
        CURRENT_PROJECT_VERSION: "15"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
